<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Jeito de Mulher</title>
        <link rel="icon" href="icon.png" type="image/png">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <section class="section bg-light" style="margin-top: 70px;">
        <div class="container">
            <h2 class="section-title">Fale Conosco</h2>
            <form class="form-grid">
                <div class="form-group form-full">
                    <label>Nome Completo</label>
                    <input type="text" required>
                </div>
                <div class="form-group form-full">
                    <label>E-mail</label>
                    <input type="email" required>
                </div>
                <div class="form-group form-full">
                    <label>Mensagem</label>
                    <textarea rows="5" style="padding: 0.8rem; border: 1px solid var(--nude); border-radius: 4px; background-color: var(--nude-claro);" required></textarea>
                </div>
                <div class="form-full">
                    <button type="submit" class="btn-primary full-width">Enviar Mensagem</button>
                </div>
            </form>
        </div>
    </section>

    <!-- COLE O FOOTER E OS MODAIS AQUI -->
    <script src="app.js"></script>
</body>
</html>
